# Data Source Configuration
sources:
  github:
    enabled: true
    rate_limit: 2.0  # seconds between requests
    targets:
      - query: "language:python stars:>1000"
      - query: "language:rust stars:>500"
      - query: "topic:artificial-intelligence"
      - query: "topic:machine-learning"
      - query: "topic:consciousness"
    max_results: 100

  arxiv:
    enabled: true
    rate_limit: 3.0
    categories:
      - cs.AI   # Artificial Intelligence
      - cs.LG   # Machine Learning
      - cs.CL   # Computation and Language
      - cs.DC   # Distributed Computing
      - cs.MA   # Multiagent Systems
      - q-bio.NC # Neurons and Cognition
    max_results: 50

  hackernews:
    enabled: true
    rate_limit: 1.0
    endpoints:
      - topstories
      - beststories
    limit: 30
    min_score: 100

  reddit:
    enabled: false  # Enable when API key available
    rate_limit: 2.0
    subreddits:
      - MachineLearning
      - artificial
      - consciousness
      - singularity
      - startups

  wikipedia:
    enabled: false
    categories:
      - Consciousness
      - Emergence
      - Complex_systems
      - Swarm_intelligence